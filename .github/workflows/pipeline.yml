name: MLOps Sales Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Schema Validation
        run: python src/data_registration.py

      - name: Run Data Preparation
        run: python src/data_preparation.py

      - name: Run Model Training & Tuning
        run: python src/model_building.py

      - name: Auto-commit Trained Model Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/best_model.pkl models/metrics.json
          git diff --staged --quiet || (git commit -m "Automated CI/CD: Model updated [skip ci]" && git push)
